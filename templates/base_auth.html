<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sign in{% endblock %} · {{ brand.name }}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        night: '#0D1B2A',
                        deep: '#1E3A8A',
                        brand: '#2563EB',
                        teal: '#14B8A6',
                        mint: '#34D399',
                        accent: '#8B5CF6',
                        mist: '#F0F7FF',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Segoe UI', 'sans-serif'],
                    },
                    boxShadow: {
                        auth: '0 25px 50px -12px rgba(30, 58, 138, 0.18)',
                    },
                },
            },
        };
    </script>
    <style>
        body { font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-mist text-slate-900 antialiased">
    <div class="relative min-h-screen overflow-hidden">
        <div class="pointer-events-none absolute inset-0">
            <div class="absolute -left-24 -top-24 h-80 w-80 rounded-full bg-brand/10 blur-3xl"></div>
            <div class="absolute right-0 top-1/4 h-96 w-96 rounded-full bg-teal/15 blur-3xl"></div>
            <div class="absolute bottom-0 left-1/3 h-72 w-72 rounded-full bg-mint/20 blur-3xl"></div>
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(37,99,235,0.08),transparent_45%)]"></div>
        </div>

        <div class="relative mx-auto flex min-h-screen max-w-6xl flex-col justify-center gap-10 px-4 py-10 lg:flex-row lg:items-center lg:gap-16 lg:px-8">
            <aside class="hidden w-full max-w-md lg:block">
                <img
                    src="{% static 'images/logo.png' %}"
                    alt="{{ brand.name }}"
                    class="mx-auto w-full max-w-sm"
                >
                <div class="mt-8 grid grid-cols-4 gap-3 text-center text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">
                    <div class="rounded-2xl border border-brand/10 bg-white/80 px-2 py-3 shadow-sm">
                        <span class="mb-2 block text-lg text-brand">📅</span>
                        Book
                    </div>
                    <div class="rounded-2xl border border-teal/10 bg-white/80 px-2 py-3 shadow-sm">
                        <span class="mb-2 block text-lg text-teal">🧳</span>
                        Manage
                    </div>
                    <div class="rounded-2xl border border-mint/20 bg-white/80 px-2 py-3 shadow-sm">
                        <span class="mb-2 block text-lg text-teal">💳</span>
                        Pay
                    </div>
                    <div class="rounded-2xl border border-accent/10 bg-white/80 px-2 py-3 shadow-sm">
                        <span class="mb-2 block text-lg text-accent">📈</span>
                        Grow
                    </div>
                </div>
                <p class="mt-6 text-center text-sm tracking-wide text-slate-500">
                    {{ brand.tagline }}.
                </p>
            </aside>

            <main class="w-full max-w-md">
                <div class="mb-6 flex flex-col items-center text-center lg:hidden">
                    <img
                        src="{% static 'images/logo.png' %}"
                        alt="{{ brand.name }}"
                        class="h-28 w-auto"
                    >
                    <p class="mt-3 text-sm text-slate-500">{{ brand.subtitle }}</p>
                </div>

                <div class="rounded-3xl border border-slate-200/80 bg-white p-6 shadow-auth sm:p-8">
                    <div class="mb-6">
                        <p class="text-xs font-bold uppercase tracking-[0.2em] text-teal">Staff access</p>
                        <h1 class="mt-2 text-2xl font-extrabold tracking-tight text-night">
                            {% block heading %}Sign in{% endblock %}
                        </h1>
                        {% block subheading %}{% endblock %}
                    </div>

                    {% include "components/alerts_auth.html" %}
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>
</body>
</html>
