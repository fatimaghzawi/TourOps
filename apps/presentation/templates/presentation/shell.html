{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Istanbul Escape{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style>
        html, body, .theater-body {
            background: #f3efe6 !important;
            color: #17202a !important;
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
        }
        h1, h2, h3, p, li, strong, span { color: #17202a; }
        a { color: #17202a; }
    </style>
    <link rel="stylesheet" href="{% static 'presentation/css/presentation.css' %}?v=6">
</head>
<body class="theater-body {% block body_class %}{% endblock %}">
    {% block theater %}{% endblock %}
    <script src="{% static 'presentation/js/presentation.js' %}?v=6"></script>
</body>
</html>
